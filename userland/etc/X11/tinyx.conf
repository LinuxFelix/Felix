# Documentation of the real TinyX command-line configuration.
# Kdrive does not read xorg.conf; felix-session passes these flags.
# Xfbdev :0 -mouse /dev/input/mice,5 -nolisten tcp -noreset -fp built-ins
# Linux VESA framebuffer (/dev/fb0), software cursor, console keyboard,
# PS/2 mouse. The ISO boot loader requests vga=0x318 (1024x768x24).

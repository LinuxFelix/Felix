SERIAL 0 115200
UI vesamenu.c32
DEFAULT felix
PROMPT 0
TIMEOUT 80
MENU TITLE Felix 1.1
MENU BACKGROUND /boot/isolinux/splash.png
MENU WIDTH 64
MENU MARGIN 8
MENU ROWS 5
MENU VSHIFT 10
MENU TABMSGROW 14
MENU TIMEOUTROW 16
MENU COLOR border 30;44 #00000000 #00000000 none
MENU COLOR title 1;37;44 #ffedf2f6 #00000000 none
MENU COLOR unsel 37;44 #ffccd6df #00000000 none
MENU COLOR sel 7;37;40 #ffffffff #b0657384 none
MENU COLOR timeout_msg 37;40 #ffb5c1cc #00000000 none
MENU COLOR timeout 1;37;40 #ffffffff #00000000 none
MENU TABMSG Press Tab to edit boot options

LABEL felix
  MENU LABEL Start Felix desktop
  MENU DEFAULT
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.cpio.xz vga=0x318 console=tty0 console=ttyS0,115200 quiet

LABEL diagnostics
  MENU LABEL Start Felix with boot messages
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.cpio.xz vga=0x318 console=tty0 console=ttyS0,115200

LABEL rescue
  MENU LABEL Recovery shell (text mode)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.cpio.xz vga=normal console=tty0 console=ttyS0,115200 felix.rescue=1

LABEL text
  MENU LABEL Felix text mode (startx)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.cpio.xz vga=0x318 console=tty0 console=ttyS0,115200 quiet felix.text=1

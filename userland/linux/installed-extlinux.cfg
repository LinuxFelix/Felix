UI vesamenu.c32
DEFAULT felix
PROMPT 0
TIMEOUT 50
MENU TITLE Felix 1.1
MENU BACKGROUND /boot/syslinux/splash.png
MENU VSHIFT 10
MENU ROWS 5
MENU TABMSGROW 14
MENU TIMEOUTROW 16
LABEL felix
 MENU LABEL Start Felix from disk
 KERNEL /boot/vmlinuz
 APPEND root=PARTUUID=@PARTUUID@ rootfstype=ext4 rootwait rw init=/sbin/felix-init vga=0x318 quiet
LABEL diagnostic
 MENU LABEL Start with boot messages
 KERNEL /boot/vmlinuz
 APPEND root=PARTUUID=@PARTUUID@ rootfstype=ext4 rootwait rw init=/sbin/felix-init vga=0x318 console=tty0 console=ttyS0,115200
LABEL rescue
 MENU LABEL Text login / recovery
 KERNEL /boot/vmlinuz
 APPEND root=PARTUUID=@PARTUUID@ rootfstype=ext4 rootwait rw init=/sbin/felix-init vga=normal felix.rescue=1

LABEL text
 MENU LABEL Felix text login (startx)
 KERNEL /boot/vmlinuz
 APPEND root=PARTUUID=@PARTUUID@ rootfstype=ext4 rootwait rw init=/sbin/felix-init vga=0x318 quiet felix.text=1
